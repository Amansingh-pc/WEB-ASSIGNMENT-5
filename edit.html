{% extends "base.html" %}

{% block title %}Edit Post — Simple Blog{% endblock %}

{% block content %}

<!-- ====== PAGE HEADER ====== -->
<div class="page-header">
    <h1>✏️ Edit Post</h1>
    <p class="subtitle">Update the title or content of your blog post.</p>
</div>

<!-- ====== EDIT FORM — pre-filled with existing post data ====== -->
<div class="form-container">
    <form action="{{ url_for('edit', post_id=post.id) }}" method="POST" id="edit-form">

        <!-- Post Title Field — pre-filled with current title -->
        <div class="form-group">
            <label for="title">Post Title <span class="required">*</span></label>
            <input
                type="text"
                id="title"
                name="title"
                value="{{ post.title }}"
                required
                maxlength="150"
                autocomplete="off"
            />
            <small class="char-counter" id="title-counter">0 / 150</small>
        </div>

        <!-- Post Content Field — pre-filled with current content -->
        <div class="form-group">
            <label for="content">Post Content <span class="required">*</span></label>
            <textarea
                id="content"
                name="content"
                required
                rows="8"
                maxlength="2000"
            >{{ post.content }}</textarea>
            <small class="char-counter" id="content-counter">0 / 2000</small>
        </div>

        <!-- Form Action Buttons -->
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">💾 Save Changes</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">✖ Cancel</a>
        </div>

    </form>
</div>

{% endblock %}
